<div class="ai-add-card">
  <div class="icon-badge">
    <app-icon name="sparkle" [size]="22" />
  </div>
  <h3>Add things effortlessly</h3>
  <p>Photograph a product, a bill or a warranty card — HomeOS files it for you.</p>

  <button type="button" class="primary" (click)="addWithPhoto()">
    <app-icon name="camera" [size]="16" />
    Add with Photo
  </button>
  <button type="button" class="ghost" (click)="addManually()">or add manually</button>
</div>
