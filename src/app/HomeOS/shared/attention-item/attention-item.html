<button type="button" class="attention-item">
  <span class="icon-badge">
    <app-icon [name]="item().icon" [size]="16" />
  </span>
  <span class="text">
    <span class="title" appTruncated>{{ item().title }}</span>
    <span class="meta" appTruncated>
      <span class="status" [class]="item().severity">{{ item().status }}</span>
      · {{ item().context }}
    </span>
  </span>
</button>
