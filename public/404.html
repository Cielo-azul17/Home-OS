<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>HomeOS</title>
  <script>
    const path = window.location.pathname;
    const basePath = '/Home-OS/';
    if (path !== basePath && path !== basePath + 'index.html') {
      const route = path.replace(basePath, '');
      window.location.replace(basePath + '#' + route);
    }
  </script>
</head>
<body></body>
</html>
